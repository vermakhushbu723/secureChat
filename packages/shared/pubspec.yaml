name: shared
description: Shared theme, widgets, models and mock data for SecureChat apps.
publish_to: none
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Brand logo (apps/logo.png): square for avatars / icons, wide for splash & welcome.
  assets:
    - assets/logo.png
    - assets/logo_wide.png
  # Inter 4.1 (SIL OFL, fonts/Inter-OFL-LICENSE.txt), used via AppTheme. Subset without
  # U+2600-27BF / U+2B00-2BFF so emoji like ❤ fall back to the colour emoji font.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
